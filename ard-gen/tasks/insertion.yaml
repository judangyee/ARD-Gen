# insertion 태스크 설정. sim/insertion_openarm_env.py:InsertionOpenArmEnv가
# 실제 구현이다(TASK_REGISTRY 매핑) -- gym-aloha(huggingface)의
# AlohaInsertionTask를 포팅했다(오른팔이 peg를, 왼팔이 socket을 쥐고 수평으로
# 슬라이드해서 꽂는다, Aloha 원본 구조 -- peg_in_hole의 수직 낙하와는 다른
# 방향, 사용자 승인된 설계).
#
# ## 미검증 상태를 정직하게 기록한다 (README "검증됨 vs 미검증" 컨벤션)
#
# 이 태스크는 **아직 성공하는 게인을 못 찾았다**. sim/insertion_openarm_env.py
# 모듈 docstring 참고 -- peg_in_hole의 admittance 제어 구조(2 피드백 축 + 1
# 삽입 축)와 양팔 home 자세(값 그대로 재사용)는 Jacobian 조건수까지 동일하게
# 나오지만(둘 다 condition number ~3.38, 실측 확인), **이 home 자세로
# 삽입 방향(socket local -z, world 기준 대략 +y)을 따라 움직이면 오른팔
# joint1/joint2가 금방 관절 한계 근처(각각 frac 0.08/0.92 부근)까지 밀리고,
# 그 뒤로 xy 정렬 오차가 (admittance 게인과 무관하게, xy 피드백을 완전히
# 꺼도 똑같이) 이동 거리에 비례해서 커진다**(실측: hover_gap을 39mm/25mm/
# 15mm/8mm로 다 줄여봐도 1000스텝 안에 pin 접촉 0회, 100% 재현). peg_in_hole
# 쪽은 이 문제를 그 태스크만의 CMA-ES 홈 자세 재탐색(optimize/
# peg_in_hole_openarm_home_pose_search.py)으로 풀었는데, 이 삽입 방향에
# 맞는 홈 자세 재탐색은 이번 작업 범위에서 하지 않았다(사용자 지시
# "성공 못 하면 억지로 넘어가지 말고 어느 단계에서 막혔는지 보고" 따름).
#
# 아래 게인 bounds/x0/sigma0은 peg_in_hole과 같은 스케일(위치 오차에 곱하는
# 게인)로 자리만 잡아뒀을 뿐, **실측으로 성공을 낸 조합이 아직 없다**
# -- 다음에 이어서 할 사람: optimize/ 아래에 이 태스크 전용 홈 자세
# 재탐색 스크립트(비용 함수: 삽입 방향으로 움직일 때 xy 누출 최소화)를
# 먼저 만들어야 CMA-ES 게인 탐색이 의미가 있다.
name: insertion

gains:
  names: [Kp_xy, Kd_xy]
  bounds:
    Kp_xy: [0.001, 0.5]
    Kd_xy: [0.0, 0.02]
  x0: [0.01, 0.0001]
  sigma0: [0.05, 0.002]

# 대표 시나리오 -- peg_in_hole의 eval_scenarios와 같은 반경/스케일(socket
# local x,y 기준 오프셋). 위 "미검증 상태" 절 참고 -- 이 3개 모두 현재
# 구현으로는 실패한다(reward_threshold 미달, success=False).
eval_scenarios:
  - peg_init_offset_xy: [0.0, 0.0]
  - peg_init_offset_xy: [0.0099, 0.0099]
  - peg_init_offset_xy: [0.0099, -0.0099]

success:
  # peg_in_hole처럼 "성공 시나리오 실측값보다 낮게"로 잡을 수가 없다(성공
  # 사례가 아직 없음) -- peg_touching_socket(+5) 보너스까지만 받은 전형적인
  # 실패 reward(~-5 ~ 0 범위, 실측)보다 뚜렷하게 높은 값으로 임시로 뒀다.
  # 실제 성공 게인을 찾기 전까지는 이 threshold를 넘는 조합이 안 나올 수
  # 있다 -- CMA-ES가 이 태스크에서 "성공"을 못 찾는 것 자체가 위에서
  # 이미 알린 미해결 문제의 재확인일 뿐, threshold 설정 오류가 아니다.
  reward_threshold: 45.0

# sim/insertion_openarm_env.py의 sample_scene_config() 스키마 =
# friction(1)+clearance_m(1)+peg_init_offset_xy(2) = 4차원 (peg_in_hole과
# 동일한 구조, socket 위치는 왼팔 고정 자세로 결정되고 scene_config로 옮길
# 자유도가 아니라는 점도 동일).
condition_fields: [friction, clearance_m, peg_init_offset_xy]

# 3단계(Stabilizer, 왼팔) 절 없음: peg_in_hole과 같은 이유(왼팔이 generic
# sim/stabilizer.py 가상 EE가 아니라 진짜 7-DOF 팔이고, socket을 쥔 채
# 고정하는 동작이 assets/insertion_bimanual_openarm.xml +
# BimanualInsertionOpenArmSim.reset()에 이미 구워져 있음).

# 5단계(언어 라벨링)용 어휘 -- peg_in_hole과 같은 "삽입 강도" 표현 재사용.
language:
  templates:
    - "오른손으로 peg를 socket에 {intensity} 끼워 넣어라."
    - "오른팔을 이용해 peg를 socket 쪽으로 {intensity} 밀어 넣어라."
    - "오른손으로 peg를 socket의 pin 위치까지 {intensity} 슬라이드시켜라."
  intensity_words:
    gentle: 살짝
    normal: 적당한 힘으로
    firm: 힘있게
  direction_words: {}
  quantity_words: {}
