# peg-in-hole 태스크 설정. sim/peg_in_hole_openarm_env.py:PegInHoleOpenArmEnv가
# 실제 구현이다(TASK_REGISTRY 매핑) -- VX300s 단일/양팔 버전(값을 여전히
# sim/peg_in_hole_env.py:PegInHoleEnv로 유지하고 있음)에서 OpenArm 양팔
# 버전으로 교체했다(사용자 요청, "OpenArm으로 교체" 결정). 게인 bounds/x0/
# sigma0/condition_fields/stabilizer 절은 그 교체 때문에 VX300s 시절 값과
# 전부 다시 잡았다 -- 아래 각 항목 주석 참고. eval_scenarios/language는
# 우연히 그대로 재사용 가능했다(값 스케일이 호환됨을 실측 확인).
name: peg_in_hole

gains:
  names: [Kp_xy, Kd_xy]
  # VX300s 시절 Kp_xy/Kd_xy는 접촉힘(N)에 곱하는 admittance 게인이었지만,
  # OpenArm 버전은 접촉힘 신호가 거의 항상 0이라(sim/
  # peg_in_hole_bimanual_openarm_sim.py 모듈 docstring "xy를 접촉힘이
  # 아니라..." 절 참고) **위치 오차(m)**에 곱하는 게인으로 의미 자체가
  # 바뀌었다 -- 그래서 스케일이 완전히 다르다(VX300s는 0.00002~0.003).
  # optimize/peg_in_hole_openarm_admittance_gain_search.py로 실측 탐색한
  # 결과값(Kp_xy=0.124630, Kd_xy=0.001125, 대표 시나리오 3개 전부 성공,
  # reward~48.8)을 bounds 안쪽 여유 있는 위치에 두고 잡았다.
  bounds:
    Kp_xy: [0.001, 0.5]
    Kd_xy: [0.0, 0.02]
  # CMA-ES 시작점 -- VX300s 때와 같은 원칙(일부러 나쁜 초기값에서 시작)으로
  # 이미 알려진 좋은 값(위 참고)보다 한참 작게 잡았다.
  x0: [0.01, 0.0001]
  sigma0: [0.05, 0.002]

# CMA-ES 평가용 대표 시나리오 3개 -- VX300s 때와 같은 peg_init_offset_xy
# 값을 그대로 재사용했다(clearance_m 스케일이 동일해서 우연히 호환됨,
# 실측 확인: 위 게인으로 3개 전부 성공, steps 157~162, reward 48.8~48.85).
eval_scenarios:
  - peg_init_offset_xy: [0.014, 0.0]
  - peg_init_offset_xy: [0.0099, 0.0099]
  - peg_init_offset_xy: [0.0099, -0.0099]

success:
  # 위 3개 시나리오 실측 reward(48.8~48.85)보다 여유 있게 낮은 값 -- 성공
  # 시나리오는 항상 넘고, 실패(성공 보너스 +50 없음)는 절대 못 넘는다.
  reward_threshold: 45.0

# pipeline/diffusion_gains.py의 조건 벡터에 쓸 필드 이름과 순서.
# sim/peg_in_hole_openarm_env.py의 sample_scene_config() 스키마(=sim
# 레벨 스키마 그 자체, VX300s와 달리 "1단계 공유 씬" 변환 단계가 따로
# 없음)의 friction(1)+clearance_m(1)+peg_init_offset_xy(2) = 4차원.
# hole_pose가 빠진 이유: OpenArm의 hole 위치는 왼팔의 고정 자세로
# 결정되고 scene_config로 옮길 수 있는 자유도가 아니다(sim/
# peg_in_hole_openarm_env.py 모듈 docstring 참고).
condition_fields: [friction, clearance_m, peg_init_offset_xy]

# 3단계(Stabilizer, 왼팔) 절 없음: OpenArm 버전은 왼팔이 generic
# sim/stabilizer.py 가상 EE가 아니라 진짜 7-DOF 팔이고, hole_socket을
# 쥔 채 고정하는 동작 자체가 assets/peg_in_hole_bimanual_openarm.xml +
# BimanualPegInHoleOpenArmSim.reset()에 이미 구워져 있다 -- 여기서
# object_body/grasp_offset을 따로 지정할 자리가 없다(sim/
# peg_in_hole_openarm_env.py 모듈 docstring "근본적 차이" 절 참고).
# episode의 left_arm 필드는 여전히 채워진다(그 파일의 left_arm_traj 기록).

# 5단계(언어 라벨링)용 어휘. peg-in-hole은 "삽입 강도"만 표현하므로
# direction_words/quantity_words는 비어 있다 -- 회전 태스크(예: cap_twist)
# 는 이 두 필드로 "토크 부호 -> 회전 방향", "회전수 -> 수량어"를 채운다
# (sim/cap_twist_env.py 주석, tasks/cap_twist.yaml 참고).
language:
  templates:
    - "오른손으로 peg를 구멍에 {intensity} 삽입하라."
    - "오른팔을 이용해 페그를 구멍 안으로 {intensity} 밀어 넣어라."
    - "오른손으로 핀을 구멍 위치에 맞춰 {intensity} 꽂아라."
  intensity_words:
    gentle: 살짝
    normal: 적당한 힘으로
    firm: 힘있게
  direction_words: {}
  quantity_words: {}
