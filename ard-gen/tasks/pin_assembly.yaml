# pin_assembly: RoCo식 "조립 + 오류 초기 상태 복구" 태스크(일반화된
# 핀-꽂기, 특정 기어 형상 재현 없음). sim/pin_assembly_openarm_env.py +
# assets/pin_assembly_openarm.xml 참고.
#
# 이 태스크는 CMA-ES로 탐색할 제어 게인이 없다(전문가 스크립트 방식,
# 사용자 지시 3) -- gains 절은 sim/task_registry.py의 TaskConfig가
# load_task_config()에서 요구하는 형식만 맞춘 더미다. 실제 데이터 생성은
# pipeline/to_lerobot_pin_assembly.py가 sim/pin_assembly_openarm_env.py의
# run_episode(scenario, rng)를 직접 호출한다(TaskConfig를 안 거침).
name: pin_assembly

gains:
  names: [seed_scale]
  bounds:
    seed_scale: [0.0, 1.0]
  x0: [0.5]
  sigma0: [0.1]

eval_scenarios:
  - scenario: S1
  - scenario: S2
  - scenario: S3

success:
  reward_threshold: 5.0  # n_assembled == 5(전부 조립)

# 1단계(공유 씬) 스키마 필드 -- sample_scene_config()가 scenario/seed를 낸다.
condition_fields: [scenario]

language:
  templates: []  # 언어 지시문은 sim/pin_assembly_openarm_env.py의 language_instruction()이 시나리오별로 직접 낸다(기존 force-profile 템플릿 체계와 무관 -- 모듈 docstring 참고)
  intensity_words: {}
  direction_words: {}
  quantity_words: {}
