# peg_in_hole의 서브태스크 그래프 -- ARD-VLA(judangyee/ARD-VLA,
# closed-loop-structure)의 DecisionLogic.load_task_graph()가 그대로 읽을 수
# 있는 스키마다: 각 노드는 {next, recoveries, max_retries}만 있으면 되고
# (그 외 키는 전부 무시됨 -- decision_logic.py의 load_task_graph() 참고),
# `max_steps`/`completion`은 ARD-Gen 쪽(sim/peg_in_hole_bimanual_openarm_sim.py
# 의 align_subtask_finished()/insert_subtask_finished(), closedloop/
# 어댑터)이 직접 읽는 ARD-Gen 전용 필드다.
#
# 노드 2개 -- align(정렬) -> insert(삽입). peg_in_hole의 admittance
# 컨트롤러가 "xy 피드백(2축) + 가변 z 하강(1축)"이라서 자연스럽게 둘로
# 나뉜다: xy가 hole 반경 안으로 들어오는 것(align)과, 그 상태에서 깊이가
# 목표까지 도달해 일정 스텝 유지되는 것(insert, 사실상 기존
# _SUCCESS_HOLD_STEPS 성공 판정 그대로).
#
# completion.threshold_xy_mult_of_outer_half: 1.0 -- clearance는
# scene_config마다 다르므로(sim.sample_scene_config 참고) outer_half가
# 고정값이 아니다. 그래서 이 YAML은 "그 에피소드의 실제 outer_half에 곱할
# 배수"만 적어두고, 실제 임계값은 런타임에 outer_half*이 배수로 계산한다
# (기존 is_success()의 xy_within_hole_footprint 판정과 똑같은 기준 --
# "정렬됐다"는 "이미 삽입 판정의 xy 조건을 만족한다"는 뜻으로 정의했다).
# 명목 clearance(0.003m)에서 참고용 수치는 outer_half=0.0195m.
align:
  next: insert
  recoveries: [R1, R2, R3, R4]
  max_retries: 3
  max_steps: 400
  completion:
    type: xy_error_below_threshold_held
    threshold_xy_mult_of_outer_half: 1.0
    hold_steps: 10
insert:
  next: null
  recoveries: [R1, R2, R3, R4]
  max_retries: 3
  max_steps: 600
  completion:
    type: depth_above_target_held
    hold_steps: 20  # sim/peg_in_hole_bimanual_openarm_sim.py의 _SUCCESS_HOLD_STEPS와 동일

# 후속 작업("timeout 진단 -> 실패 유형 재정의", PIPELINE.md 참고) -- 새
# 기본 실패 유형(F1a/F1b/F2/F3/timeout, classify_failure_by_subtask())
# 마다 기본 복구를 다르게 매핑한다. decision_logic.load_task_graph()는
# 이 키를 모르므로 무시한다(ARD-Gen 쪽 generate_closed_loop_episodes.py/
# diagnose_timeout_boundaries.py가 직접 읽는 전용 필드 -- align/insert의
# max_steps/completion과 같은 패턴). `legacy_failure_rule=True`면 이
# 맵을 안 쓰고 예전처럼 전부 R2다(ARD-Gen 전용 단순화 로컬 규칙, ARD-VLA
# 의 DecisionLogic은 자기 자신의 failure_type_to_recovery로 매핑하므로
# 이 맵과 무관하다).
#
# 근거(pipeline/measure_recovery_success.py 실측, N>=20 -- PIPELINE.md
# "실패 유형 재정의" 절에 전체 표): **처음 의도("걸림은 R3로 더 세게
# 밀어붙인다")는 실측으로 틀렸다고 나왔다** -- F1b를 R3로 두면 복구
# 성공률 0%(N=51)였는데, R2(제자리 되돌림)로 바꾸면 9.8%(N=51)로
# 올라갔다. R3는 게인만 올리고 물리 위치는 안 바꾸는데, narrow_
# clearance류 걸림은 게인을 올려도 똑같은 자리에서 또 끼이는 쪽이 더
# 흔했던 것으로 보인다 -- 완전히 제자리로 되돌리는 R2 쪽이 그나마
# 나았다. F1a는 R2/R3 둘 다 거의 효과가 없었다(각각 1.4%, N=72/73 --
# 재정렬 실패/진동은 위치를 되돌리거나 게인을 올리는 것만으로는 잘
# 안 풀리는 듯하다, bad_gains/xy_target_bias처럼 행동 자체를 왜곡하는
# 교란은 두 복구 다 그 왜곡 자체를 안 없애기 때문으로 추정). F2/F3는
# 여전히 100%(N=43/79, 4단계 때 실측과 일치). timeout->R1은 R1 자체의
# 버그(_step_in_subtask를 안 리셋해서 즉시 재-timeout되던 문제,
# closedloop/peg_in_hole_adapter.py 참고)를 고친 뒤에도 0%(N=20)였다
# -- "거의 성공"으로 분류된 사례들을 들여다보면 예산을 더 줘도 같은
# 상태에서 같은 역학(오실레이션/정체)이 계속돼 그냥 다시 F1a/timeout이
# 되는 쪽이 많았다(한두 사례 직접 추적 확인). 그래도 R1을 그대로
# 쓴다 -- R2/R3로 바꿔도 더 나아진다는 증거가 없고(이 유형은 애초에
# "상태를 안 건드리고"가 의미인 유형이라 바꾸면 라벨의 뜻과 안 맞음),
# 적어도 더 나빠지지도 않는다. **F1a/F1b/timeout 전반적으로 이
# 단순화된 "로컬 규칙 1회 재시도"로는 복구가 잘 안 된다는 것 자체가
# 이번 실측의 핵심 결론이다** -- F2/F3(물리적으로 되돌리기만 하면
# 되는 파지 실패)와 나머지(컨트롤러/환경 수준 문제)의 성격이 근본적으로
# 다르다는 뜻으로 해석했다(정직하게 기록, 다음 작업으로 미룸).
failure_recovery:
  F1a: R2
  F1b: R2
  F2: R2
  F3: R2
  timeout: R1
