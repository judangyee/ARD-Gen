# tacker(타카): "위치 정확도 + 1회성 발사" 태스크 설정, OpenArm 양팔 버전
# (assets/tacker_openarm.xml + sim/tacker_openarm_env.py 상단 docstring 참고).
#
# 일반 Stabilizer(3-슬라이드 가상 EE) 버전은 peg_in_hole에서 이미 OpenArm으로
# 교체되면서 레거시가 된 패턴이라 여기서는 다시 쓰지 않는다(사용자 지시) --
# 이 태스크는 처음부터 OpenArm 양팔 구조(sim/peg_in_hole_openarm_env.py 패턴)
# 로 만들었다. 왼팔은 실제 7-DOF 팔로 workpiece를 직접 쥐고(peg_in_hole의
# grasp anchor/home 자세를 그대로 재사용), 오른팔은 연속 힘 조절이 필요
# 없는 위치 접근 + 자동 발사만 한다.
name: tacker

gains:
  names: [Kp_approach]
  # 일반 Stabilizer 버전 tacker와 같은 이유로 landscape가 평탄하다(0.02~3.0
  # 전 구간에서 성공, 실측 확인) -- 이 태스크의 물리적 핵심이 애초에 이
  # 게인이 아니라 왼팔(강화 게인 유무)이라서다. bounds는 그 평탄한 구간을
  # 그대로 담았다.
  bounds:
    Kp_approach: [0.02, 3.0]
  x0: [0.03]
  sigma0: [0.3]

# CMA-ES 평가용 대표 시나리오 3개 -- 전부 Kp_approach=0.5로 성공하는(reward
# 65~70대) 수준의 접근 오프셋/반동 강도 조합으로 잡았다(더 가혹한 반동은
# bootstrap/filter 단계의 무작위 샘플링(recoil_strength 5~35)에서 자연스럽게
# 커버된다 -- eval_scenarios는 "게인이 있어야 성공하는" 최소 난이도만 보장).
eval_scenarios:
  - tool_init_offset_xy: [0.02, -0.015]
    recoil_strength: 12.0
  - tool_init_offset_xy: [-0.015, 0.02]
    recoil_strength: 15.0
  - tool_init_offset_xy: [0.01, 0.02]
    recoil_strength: 10.0

success:
  # retract 단계 추가로 보너스 항(+10, 후퇴 완료)이 늘어 리워드 상한이
  # ~69~70대 -> ~79~80대로 올라갔다 -- 이전과 같은 여유(상한보다 5 아래)를
  # 유지하려고 65.0 -> 75.0으로 올렸다.
  reward_threshold: 75.0

# 후퇴(retract) 단계 파라미터 -- 실제 값은 sim/tacker_openarm_env.py의
# RETRACT_SAFE_DISTANCE_M/RETRACT_TOLERANCE_M/RETRACT_MAX_STEPS/
# FINAL_SETTLE_STEPS 상수에 있다(다른 물리 상수, 예: FIRE_TOLERANCE_M와
# 같은 방식 -- TaskConfig가 임의의 yaml 절을 Env로 그대로 전달하는 범용
# 메커니즘이 없어서, 씬 무작위화 대상이 아닌 태스크 레벨 상수는 코드에
# 두고 여기서는 문서화만 한다). 사용자 요청대로 여기 그대로 옮겨 적는다:
#   safe_distance_m: 0.05   # 발사 지점에서 이만큼 수직으로 물러나면 "후퇴 완료"
#   tolerance_m: 0.005      # 후퇴 목표점 도달 판정 허용 오차
#   max_steps: 100          # 후퇴 예산
#   final_settle_steps: 20  # 그립 해제(release_grip_after) 영향을 관찰하는 추가 정착 스텝
#
# ## 왼팔 강화 게인을 언제 놓아도 되는가 (N=150 실측, 세 옵션 비교)
#
# TackerOpenArmEnv(release_grip_after=...)로 "none"(끝까지 유지, 기본값)/
# "fire_settle"(발사 반동이 가라앉자마자, 후퇴 시작 전 해제)/"retract"
# (후퇴까지 다 끝난 뒤 해제) 세 가지를 구현해서 비교했다 -- 결론과 전체
# 수치는 PIPELINE.md의 tacker retract 절 참고. 요약: 세 옵션 다 전체
# 성공률(72~73%)은 거의 안 갈리지만, 어느 구간에서 workpiece가 밀리는지가
# 갈린다 -- "none"이 모든 구간에서 밀림이 가장 작고(각 구간 중앙값 <0.2mm),
# "fire_settle"은 후퇴 구간에서, "retract"는 최종 정착 구간에서 밀림이
# 커진다(특히 "retract"의 최종 정착 밀림은 최댓값 기준 19mm까지 커져서
# 셋 중 최악의 worst-case를 보인다). **그래서 정식 데이터 생성은 "none"
# (기본값)으로 실행했다** -- 실제로 그립 힘을 아끼고 싶다면 "retract"보다
# "fire_settle"이 더 안전한 선택이다(같은 결론이지만 최악의 경우가 훨씬
# 덜 나쁨).

# pipeline/diffusion_gains.py의 조건 벡터에 쓸 필드 이름과 순서.
# sim/tacker_openarm_env.py의 sample_scene_config() 스키마 = sim 레벨 스키마
# 그 자체(peg_in_hole OpenArm 버전과 같은 이유로 별도 "1단계 공유 씬" 변환이
# 없음)의 nail_offset_xy(2)+tool_init_offset_xy(2)+recoil_strength(1)+
# recoil_angle(1) = 6차원.
condition_fields: [nail_offset_xy, tool_init_offset_xy, recoil_strength, recoil_angle]

# 3단계(Stabilizer) 절 없음: 왼팔이 generic sim/stabilizer.py 가상 EE가
# 아니라 진짜 7-DOF 팔이고, workpiece를 쥔 채 고정하는 동작 자체가
# assets/tacker_openarm.xml(항상 활성인 workpiece_grasp weld) + 왼팔 고정
# 관절각에 이미 구워져 있다 -- object_body/grasp_offset을 따로 지정할
# 자리가 없다(sim/tacker_openarm_env.py 모듈 docstring 참고). episode의
# left_arm 필드는 여전히 채워진다(그 파일의 left_arm_traj 기록, 값은
# 거의 고정이지만 role classifier 스키마 일관성을 위해).

# 5단계(언어 라벨링)용 어휘 -- 일반 Stabilizer 버전 tacker와 동일(방향어/
# 수량어 없음, 강도어만).
language:
  templates:
    - "표시된 지점을 조준해서 {intensity} 발사하라."
    - "타카를 목표 위치에 정확히 대고 {intensity} 눌러라."
    - "목표 지점에 맞춰 신중하게 조준한 뒤 {intensity} 박아라."
  intensity_words:
    gentle: 살짝
    normal: 적당한 세기로
    firm: 힘있게
  direction_words: {}
  quantity_words: {}
