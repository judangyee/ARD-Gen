# 작업 2(교란 분포 재조정, 2-2) 설정 -- B세트 교란 타입 가중치 + injected
# 미끄러짐(F2/F3)의 연속분포 범위. 전부 숫자 상수라 코드를 안 고치고 이
# 파일만 바꿔서 다시 조정할 수 있다(사용자 지시 "코드 상수로 남기지
# 않고 YAML/CLI로 뺀다"). 이 파일을 안 주면(`--disturbance-config` 생략)
# generate_closed_loop_episodes.py는 5단계 때의 원래 동작(균등분포,
# injected는 고정 15mm/step randint(60,150))을 그대로 쓴다(새 기능 기본
# 꺼짐 규칙 -- PIPELINE.md "작업2" 절의 "껐을 때 bit-identical" 테스트가
# 이걸 확인한다).
#
# 아래 기본값은 pipeline/sweep_injected_slip.py(2-1 스윕 + 후속 작업
# "y방향 포함 8방향 스윕", PIPELINE.md 결과 표) 실측 기준으로 골랐다:
# - F2(오른팔, Actuator): 진행도 비율 0.6(= timing_effective) 근방에서
#   8방향 전부(±x/±y/대각선4) 상당한 실패율을 보였다 -- 오른팔
#   손목(peg_grasp 기준 body)이 세계좌표축과 거의 정확히 정렬돼 있어서
#   (실측: local x/y -> world x/y 거의 1:1, z성분 3% 미만) 로컬 방향이
#   곧 "실제 어느 쪽으로 미는가"와 거의 같기 때문으로 보인다 -- 그래서
#   방향은 전체 원에서 고르게 뽑아도 된다. 가중치는 효과가 뚜렷해서
#   다른 타입(각 1.0)보다 높였다.
# - F3(왼팔, Stabilizer): 8방향 스윕으로 보니 "-x만 효과적"이 아니라
#   90도~270도(= -x 주변 반원, -y/+y(큰 magnitude)/-x+y/-x-y 전부
#   포함)가 폭넓게 효과적이고 +x 주변(약 -45~45도)만 거의 항상 안전했다
#   -- 원인을 왼팔 손목 자세에서 찾았다(아래 "F3 방향 의존성 원인"
#   참고, 왼팔의 로컬 x축이 세계좌표 Z축에 거의 정렬돼 있어서 로컬
#   방향 라벨이 "얼마나 깊이 방향으로 미는가"와 "XY를 얼마나 깨뜨리는가"
#   가 뒤섞인 임의의 축이 된다). 그래서 처음(±40도)보다 훨씬 넓은
#   반원(center_deg=180, spread_deg=90)으로 고쳤다. F2보다 더 큰
#   magnitude가 필요해서 범위도 더 넓게 잡았다.
# - 미끄러짐 크기 vs hole 반폭(outer_half, 명목 clearance 기준
#   ~19.5mm) 관계: 10mm는 반폭의 절반 수준(점진적 "미끄러짐"에 가까움),
#   20mm는 반폭과 비슷한 수준(경계선), 30-35mm는 반폭을 넘어서(거의
#   "놓침"에 가까운 큰 이동) -- F2[10,30]/F3[20,35] 범위가 전부 "순수
#   미끄러짐"이 아니라 일부는 "놓침"에 더 가까운 크기를 포함한다는 뜻
#   (해석에 반영, 사용자 지시 -- 범위 자체는 안 줄였다 -- 큰 이동도
#   F2/F3가 실제 실패를 만드는 데 필요했기 때문. 자세한 표는
#   PIPELINE.md "y방향 스윕" 절 참고).
# - timing_effective/timing_hard_negative 절대 스텝 범위는 2-1 스윕의
#   dry-run 실측(B 난이도 씬에서 insert_start~10, insert_len 중앙값 146,
#   범위 121-152 -- 씬마다 꽤 일정함)을 "진행도 비율 0.45-0.85"(효과적) /
#   "0.05-0.3"(거의 안 실패 -- hard negative용)로 환산한 값이다.
# - narrow_clearance/bad_gains/xy_target_bias 가중치(1.0 -> 3.0/2.0/2.0):
#   F1a/F1b 재정의(실패 유형 재정의 작업) 뒤 B를 재생성해보니 이 세
#   타입이 F1b(걸림)/F1a(정렬미수렴·진동)의 주 공급원이었는데(timeout
#   진단 228개 표본의 교란×유형 교차표와 일치: narrow_clearance->걸림,
#   bad_gains/xy_target_bias->진동), 원래 가중치(1.0)로는 경계 판정
#   분포에서 F1a 2.2%/F1b 3.7%로 너무 적었다 -- 세 타입을 두세 배
#   올려서 더 자주 뽑히게 했다(실제 달성치는 PIPELINE.md "마무리" 절
#   B 재생성 결과 참고 -- 10%까지는 못 미쳤다, 억지로 더 맞추지 않음).

b_weights:
  action_noise: 1.0
  xy_target_bias: 2.0
  bad_gains: 2.0
  narrow_clearance: 3.0
  high_friction: 1.0
  injected_slip_F2: 9.0
  injected_slip_F3: 10.0

injected:
  magnitude_mm:
    F2: [10, 30]
    F3: [20, 35]
  # 방향: F2는 8방향 스윕에서 전부 꽤 효과적이라 전체 원에서 고르게
  # 뽑는다(오른팔 손목이 세계좌표축과 정렬돼 있어서, 위 "아래 기본값"
  # 절 참고). F3는 -x 중심 반원(90-270도)이 넓게 효과적이므로 그
  # 범위로 몰아 뽑고, off_target_prob만큼만 전체 원에서 뽑아 "방향이
  # 안 맞아서 실패 안 함" 자연 발생 hard negative를 공급한다(+x 주변
  # ~90도는 8방향 스윕에서 거의 항상 안전했던 구간).
  direction:
    F2: {mode: full_circle}
    F3: {mode: concentrated, center_deg: 180, spread_deg: 90, off_target_prob: 0.3}
  timing_effective_step_range: [75, 135]
  timing_hard_negative_step_range: [15, 55]
  # "미끄러짐은 났지만 에피소드는 성공"(hard negative) 비율을 올리려고
  # 타이밍 샘플 중 이 비율만큼은 일부러 "거의 안 실패하는" 구간에서
  # 뽑는다(사용자 지시 "이 비율을 설정으로 남기고 실제 달성 비율도
  # 기록"). 실제 달성 비율은 PIPELINE.md에 기록(타이밍 구간만으로는
  # hard negative가 보장되지 않는다 -- 방향/크기도 영향을 주므로 실측값은
  # 이 설정값과 다를 수 있다).
  hard_negative_prob: 0.25
